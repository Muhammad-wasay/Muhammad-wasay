<!-- pixel-sleep.svg: Sleeping at desk, ZZZ floating (Footer character) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 110" shape-rendering="crispEdges" width="128" height="110">
  <defs>
    <style>
      .zzz1 { animation: zzz1 2s ease-in-out infinite; }
      .zzz2 { animation: zzz2 2s ease-in-out infinite 0.5s; }
      .zzz3 { animation: zzz3 2s ease-in-out infinite 1s; }
      .sleeper { animation: breathe 3s ease-in-out infinite; transform-origin: 64px 70px; }
      .zz-txt { font-family: monospace; font-size: 10px; font-weight: bold; fill: #478CBF; }
      @keyframes breathe { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.03)} }
      @keyframes zzz1 { 0%{opacity:0;transform:translate(0,0)} 50%{opacity:1} 100%{opacity:0;transform:translate(6px,-14px)} }
      @keyframes zzz2 { 0%{opacity:0;transform:translate(0,0)} 50%{opacity:1} 100%{opacity:0;transform:translate(9px,-18px)} }
      @keyframes zzz3 { 0%{opacity:0;transform:translate(0,0)} 50%{opacity:1} 100%{opacity:0;transform:translate(12px,-22px)} }
    </style>
  </defs>
  <!-- Desk -->
  <rect x="10" y="82" width="108" height="8" fill="#333"/>
  <rect x="10" y="88" width="10" height="20" fill="#2A2A2A"/>
  <rect x="108" y="88" width="10" height="20" fill="#2A2A2A"/>
  <!-- Sleeping body slumped on desk -->
  <g class="sleeper">
    <!-- arms on desk -->
    <rect x="20" y="76" width="88" height="10" fill="#1E1E1E"/>
    <!-- head resting on arms (turned sideways) -->
    <rect x="44" y="52" width="40" height="30" fill="#D8B59A"/>
    <!-- hair on top -->
    <rect x="42" y="48" width="44" height="12" fill="#171717"/>
    <rect x="38" y="52" width="10" height="20" fill="#171717"/>
    <!-- closed eyes (sleeping X) -->
    <rect x="52" y="64" width="8" height="2" fill="#222"/>
    <rect x="54" y="62" width="4" height="6" fill="#D8B59A"/>
    <rect x="52" y="62" width="2" height="2" fill="#222"/>
    <rect x="58" y="62" width="2" height="2" fill="#222"/>
    <rect x="52" y="66" width="2" height="2" fill="#222"/>
    <rect x="58" y="66" width="2" height="2" fill="#222"/>
    <!-- second eye -->
    <rect x="66" y="64" width="8" height="2" fill="#222"/>
    <rect x="68" y="62" width="4" height="6" fill="#D8B59A"/>
    <rect x="66" y="62" width="2" height="2" fill="#222"/>
    <rect x="72" y="62" width="2" height="2" fill="#222"/>
    <rect x="66" y="66" width="2" height="2" fill="#222"/>
    <rect x="72" y="66" width="2" height="2" fill="#222"/>
    <!-- small mouth (pout) -->
    <rect x="58" y="74" width="12" height="3" fill="#8B5A52"/>
    <!-- hoodie visible -->
    <rect x="20" y="76" width="88" height="6" fill="#252525"/>
  </g>
  <!-- Floating ZZZ -->
  <text class="zzz1 zz-txt" x="84" y="50">z</text>
  <text class="zzz2 zz-txt" x="90" y="40" style="font-size:13px">z</text>
  <text class="zzz3 zz-txt" x="98" y="28" style="font-size:16px">Z</text>
  <!-- Coffee cup on desk -->
  <rect x="20" y="70" width="14" height="14" fill="#8B5A52"/>
  <rect x="18" y="72" width="2" height="8" fill="#6B3A32"/>
  <rect x="22" y="68" width="10" height="4" fill="#C0784A"/>
  <rect x="23" y="66" width="8" height="3" fill="#D0D0D0" opacity="0.5"/>
</svg>
