<!-- pixel-gamer.svg: Standing, holding game controller (Game Dev section) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 160" shape-rendering="crispEdges" width="128" height="160">
  <defs>
    <style>
      .gamer-body { animation: bounce 2.5s ease-in-out infinite; transform-origin: 64px 100px; }
      .btn-a { animation: press 1.2s step-end infinite; }
      .btn-b { animation: press 1.2s step-end infinite 0.3s; }
      .btn-x { animation: press 1.2s step-end infinite 0.6s; }
      .btn-y { animation: press 1.2s step-end infinite 0.9s; }
      .eye-gl { animation: wink 5s step-end infinite; }
      .controller-glow { animation: cglow 1.5s ease-in-out infinite; }
      @keyframes bounce  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
      @keyframes press   { 0%,100%{opacity:1} 50%{opacity:0.2} }
      @keyframes wink    { 0%,85%,100%{transform:scaleY(1)} 90%{transform:scaleY(0.1)} }
      @keyframes cglow   { 0%,100%{opacity:0.6} 50%{opacity:1} }
    </style>
  </defs>
  <ellipse cx="64" cy="156" rx="30" ry="4" fill="#B0B0B0" opacity="0.4"/>
  <g class="gamer-body">
    <!-- hoodie body (slightly wider stance) -->
    <rect x="34" y="62" width="60" height="52" fill="#1E1E1E"/>
    <!-- arms stretched holding controller -->
    <rect x="14" y="72" width="20" height="10" fill="#1E1E1E"/>
    <rect x="94" y="72" width="20" height="10" fill="#1E1E1E"/>
    <!-- legs -->
    <rect x="38" y="112" width="18" height="28" fill="#252525"/>
    <rect x="72" y="112" width="18" height="28" fill="#252525"/>
    <!-- shoes -->
    <rect x="34" y="136" width="24" height="8" fill="#111"/>
    <rect x="70" y="136" width="24" height="8" fill="#111"/>
    <!-- hoodie detail -->
    <rect x="60" y="70" width="8" height="30" fill="#2A2A2A"/>
    <rect x="60" y="92" width="8" height="4" fill="#478CBF"/>
    <!-- head -->
    <rect x="40" y="20" width="48" height="44" fill="#D8B59A"/>
    <rect x="32" y="30" width="8" height="24" fill="#D8B59A"/>
    <rect x="88" y="30" width="8" height="24" fill="#D8B59A"/>
    <!-- hair -->
    <rect x="32" y="16" width="64" height="14" fill="#171717"/>
    <rect x="28" y="20" width="12" height="20" fill="#171717"/>
    <rect x="40" y="12" width="48" height="10" fill="#171717"/>
    <rect x="80" y="18" width="10" height="14" fill="#171717"/>
    <rect x="40" y="20" width="48" height="6" fill="#252525"/>
    <!-- eyes -->
    <rect x="46" y="40" width="12" height="8" fill="#FFF"/>
    <rect x="70" y="40" width="12" height="8" fill="#FFF"/>
    <rect class="eye-gl" x="49" y="42" width="6" height="5" fill="#478CBF"/>
    <rect x="73" y="42" width="6" height="5" fill="#222"/>
    <rect x="46" y="37" width="12" height="2" fill="#171717"/>
    <rect x="70" y="37" width="12" height="2" fill="#171717"/>
    <!-- smirk (confident) -->
    <rect x="58" y="56" width="18" height="3" fill="#8B5A52"/>
    <rect x="72" y="54" width="4" height="3" fill="#8B5A52"/>
    <!-- hands -->
    <rect x="12" y="80" width="10" height="8" fill="#D8B59A"/>
    <rect x="106" y="80" width="10" height="8" fill="#D8B59A"/>
    <!-- === GAME CONTROLLER === -->
    <rect class="controller-glow" x="26" y="84" width="76" height="34" rx="8" fill="#222"/>
    <rect x="28" y="86" width="72" height="30" rx="6" fill="#2D2D2D"/>
    <!-- D-pad left side -->
    <rect x="36" y="96" width="6" height="4" fill="#444"/>
    <rect x="40" y="92" width="4" height="12" fill="#444"/>
    <!-- ABXY buttons right side -->
    <rect class="btn-y" x="80" y="92" width="6" height="6" fill="#6BCF6B"/>
    <rect class="btn-a" x="88" y="97" width="6" height="6" fill="#CF6B6B"/>
    <rect class="btn-b" x="80" y="102" width="6" height="6" fill="#6BAACF"/>
    <rect class="btn-x" x="72" y="97" width="6" height="6" fill="#CFCF6B"/>
    <!-- Center buttons -->
    <rect x="57" y="96" width="6" height="4" fill="#333"/>
    <rect x="65" y="96" width="6" height="4" fill="#333"/>
    <!-- Joystick nubs -->
    <rect x="46" y="104" width="8" height="8" rx="4" fill="#444"/>
    <rect x="74" y="104" width="8" height="8" rx="4" fill="#444"/>
    <!-- Emerald accent line on controller -->
    <rect x="30" y="114" width="68" height="2" fill="#478CBF" opacity="0.5"/>
  </g>
</svg>
