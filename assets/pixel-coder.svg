<!-- pixel-coder.svg: Sitting at laptop, typing (Header character) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 148" shape-rendering="crispEdges" width="128" height="148">
  <defs>
    <style>
      .coder-body { animation: float 3s ease-in-out infinite; transform-origin: 64px 90px; }
      .eye-l { animation: blink 4s step-end infinite; }
      .eye-r { animation: blink 4s step-end infinite 0.1s; }
      .scr   { animation: glow  2s ease-in-out infinite; }
      .k1    { animation: type  0.7s step-end infinite; }
      .k2    { animation: type  0.7s step-end infinite 0.15s; }
      .k3    { animation: type  0.7s step-end infinite 0.3s; }
      .cur   { animation: cblink 1s step-end infinite; }
      .hl    { animation: tap 0.7s ease-in-out infinite; transform-origin: 28px 92px; }
      .hr    { animation: tap 0.7s ease-in-out infinite 0.2s; transform-origin: 100px 92px; }
      @keyframes float  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
      @keyframes blink  { 0%,88%,100%{transform:scaleY(1)} 94%{transform:scaleY(0.1)} }
      @keyframes glow   { 0%,100%{opacity:1} 50%{opacity:0.35} }
      @keyframes type   { 0%,100%{opacity:1} 50%{opacity:0.15} }
      @keyframes cblink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes tap    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(2px)} }
    </style>
  </defs>
  <ellipse cx="64" cy="143" rx="34" ry="4" fill="#B0B0B0" opacity="0.4"/>
  <g class="coder-body">
    <!-- hoodie -->
    <rect x="32" y="58" width="64" height="45" fill="#1E1E1E"/>
    <rect x="22" y="68" width="12" height="30" fill="#1E1E1E"/>
    <rect x="94" y="68" width="12" height="30" fill="#1E1E1E"/>
    <rect x="44" y="96" width="40" height="8" fill="#111"/>
    <rect x="62" y="68" width="4" height="22" fill="#2A2A2A"/>
    <rect x="61" y="88" width="6" height="3" fill="#478CBF"/>
    <!-- head -->
    <rect x="40" y="22" width="48" height="40" fill="#D8B59A"/>
    <rect x="32" y="32" width="8" height="22" fill="#D8B59A"/>
    <rect x="88" y="32" width="8" height="22" fill="#D8B59A"/>
    <!-- hair -->
    <rect x="32" y="18" width="64" height="14" fill="#171717"/>
    <rect x="28" y="22" width="12" height="18" fill="#171717"/>
    <rect x="40" y="14" width="48" height="10" fill="#171717"/>
    <rect x="80" y="20" width="10" height="12" fill="#171717"/>
    <rect x="40" y="22" width="48" height="6" fill="#252525"/>
    <!-- eyes -->
    <rect x="46" y="40" width="12" height="8" fill="#FFF"/>
    <rect x="70" y="40" width="12" height="8" fill="#FFF"/>
    <rect class="eye-l" x="49" y="42" width="6" height="5" fill="#222"/>
    <rect class="eye-r" x="73" y="42" width="6" height="5" fill="#222"/>
    <rect x="46" y="37" width="12" height="2" fill="#171717"/>
    <rect x="70" y="37" width="12" height="2" fill="#171717"/>
    <!-- smile -->
    <rect x="54" y="54" width="20" height="3" fill="#8B5A52"/>
    <rect x="56" y="52" width="4" height="2" fill="#8B5A52"/>
    <rect x="68" y="52" width="4" height="2" fill="#8B5A52"/>
    <!-- hands -->
    <g class="hl"><rect x="20" y="90" width="10" height="8" fill="#D8B59A"/><rect x="20" y="90" width="2" height="6" fill="#C4A080"/><rect x="23" y="90" width="2" height="7" fill="#C4A080"/><rect x="26" y="90" width="2" height="6" fill="#C4A080"/></g>
    <g class="hr"><rect x="98" y="90" width="10" height="8" fill="#D8B59A"/><rect x="98" y="90" width="2" height="6" fill="#C4A080"/><rect x="101" y="90" width="2" height="7" fill="#C4A080"/><rect x="104" y="90" width="2" height="6" fill="#C4A080"/></g>
    <!-- laptop -->
    <rect x="26" y="97" width="76" height="20" fill="#444"/>
    <rect x="30" y="80" width="68" height="20" fill="#333"/>
    <rect x="33" y="82" width="62" height="16" fill="#0D0D0D"/>
    <rect class="scr" x="33" y="82" width="62" height="16" fill="#478CBF" opacity="0.08"/>
    <rect x="36" y="84" width="20" height="2" fill="#478CBF" opacity="0.9"/>
    <rect x="36" y="88" width="30" height="2" fill="#6BCF6B" opacity="0.8"/>
    <rect x="36" y="92" width="15" height="2" fill="#CF6B6B" opacity="0.7"/>
    <rect class="cur" x="58" y="92" width="2" height="2" fill="#FFF"/>
    <rect class="k1" x="34" y="101" width="6" height="4" fill="#478CBF" rx="1"/>
    <rect class="k2" x="44" y="101" width="6" height="4" fill="#478CBF" rx="1" opacity="0.5"/>
    <rect class="k3" x="54" y="101" width="20" height="4" fill="#555" rx="1"/>
    <rect x="78" y="101" width="6" height="4" fill="#555" rx="1"/>
    <rect x="88" y="101" width="6" height="4" fill="#478CBF" rx="1" opacity="0.6"/>
    <rect x="34" y="107" width="8" height="4" fill="#3A3A3A" rx="1"/>
    <rect x="45" y="107" width="8" height="4" fill="#3A3A3A" rx="1"/>
    <rect x="57" y="107" width="14" height="4" fill="#3A3A3A" rx="1"/>
    <rect x="74" y="107" width="8" height="4" fill="#3A3A3A" rx="1"/>
    <rect x="85" y="107" width="8" height="4" fill="#3A3A3A" rx="1"/>
    <rect x="22" y="116" width="84" height="4" fill="#333"/>
    <rect x="52" y="112" width="24" height="3" fill="#3D3D3D"/>
    <rect x="58" y="68" width="4" height="4" fill="#478CBF"/>
    <rect x="64" y="68" width="4" height="4" fill="#2D6E9E"/>
  </g>
</svg>
